name: Despliegue herramienta interna

# Convive con la app de master (docker-ci.yml), que se despliega en DEPLOY_PATH.
# La herramienta usa su propia copia del repo en la carpeta de la variable de
# Actions HERRAMIENTA_PATH (Settings → Secrets and variables → Actions → Variables)
# y su propio proyecto de compose, así que nunca toca la carpeta ni los
# contenedores de master.

on:
  push:
    branches: [ "feat/herramienta-interna" ]
  workflow_dispatch:

concurrency:
  group: deploy-herramienta
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Tests de cálculo
        run: |
          pip install -r backend/requirements.txt pytest
          python -m pytest test_calculos_capacidad.py test_nidal_calculo_modelo.py test_ficha_tecnica.py -q

      - name: Construir imágenes
        run: docker compose build

  deploy:
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: Actualizar código y relanzar contenedores
        shell: bash
        env:
          DIR: ${{ vars.HERRAMIENTA_PATH }}
        run: |
          set -e
          if [ -z "$DIR" ]; then
            echo "Falta la variable HERRAMIENTA_PATH (carpeta del servidor donde vive la herramienta)" >&2
            exit 1
          fi
          if [ ! -d "$DIR/.git" ]; then
            git clone --branch feat/herramienta-interna "https://github.com/${{ github.repository }}.git" "$DIR"
          fi
          cd "$DIR"
          git fetch origin feat/herramienta-interna
          # backend/datos (ficha técnica editada) está ignorado por git: el reset no lo toca
          git reset --hard origin/feat/herramienta-interna
          docker compose up -d --build
          docker compose ps
