version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend_aviario
    ports:
      - "8080:8000"
    environment:
      - FRONTEND_URL=http://frontend:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend_aviario
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
