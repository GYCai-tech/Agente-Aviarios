# Herramienta interna «Estudio de nave». En el servidor se publica en el 3000
# (el despliegue de master fija HERRAMIENTA_PORT); en local, en el 3001.
# El 8080 es de code-server.
name: herramienta-interna

services:
  backend:
    build: ./backend
    container_name: backend_herramienta
    # Sin puerto en el host: solo lo usa el frontend por la red interna de compose
    environment:
      - FRONTEND_URL=http://frontend:3000
    volumes:
      # Ficha técnica editada desde la app (persiste entre despliegues)
      - ./backend/datos:/app/datos
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend_herramienta
    ports:
      # Puerto en el host configurable con HERRAMIENTA_PORT (en el .env junto a este archivo)
      - "${HERRAMIENTA_PORT:-3001}:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
